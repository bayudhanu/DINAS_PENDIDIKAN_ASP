<!-- begin :: Halaman Tambah Kelas -->
<!-- begin :: Tombol Tambah Kelas -->
<p-button (onClick)="dialogAddKelas()" icon="pi pi-plus" label="Tambah" [outlined]="true" severity="outlineCustomGrayBlueButton" />
<!-- end :: Tombol Tambah Kelas -->

<!-- begin :: Dialog Tambah Kelas -->
<p-dialog 
    header="TAMBAH KELAS" 
    [(visible)]="visible" 
    [modal]="true"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
    [style]="{ width: '50vw' }"
    [draggable]="false"
    [resizable]="false">
    
    <!-- begin :: Konten Dialog -->
    <div class="p-fluid p-formgrid grid">
        <div class="field col-12 md:col-6">
            <label htmlfor="kode">Kode<span class="p-error">*</span></label>
            <input pinputtext="" id="kode" type="text" class="p-inputtext customInputText" placeholder="Tulis kode kelas" >
        </div>
        <div class="field col-12 md:col-6">
            <label htmlfor="unitSekolah">Unit Sekolah<span class="p-error">*</span></label>
            <p-dropdown [options]="dropdownUnitSekolah" [(ngModel)]="selectedUnitSekolah" optionLabel="name" [filter]="true" filterBy="name" [showClear]="true" appendTo="body" placeholder="Pilih unit sekolah">
                <ng-template pTemplate="selectedItem">
                    <div class="flex align-items-center gap-2" *ngIf="selectedUnitSekolah">
                        <div>{{ selectedUnitSekolah.name }}</div>
                    </div>
                </ng-template>
                <ng-template let-unitSekolah pTemplate="item">
                    <div class="flex align-items-center gap-2">
                        <div>{{ unitSekolah.name }}</div>
                    </div>
                </ng-template>
            </p-dropdown>
        </div>
        <div class="field col-12 md:col-6">
            <label htmlfor="nama">Nama Kelas<span class="p-error">*</span></label>
            <input pinputtext="" id="nama" type="text" class="p-inputtext customInputText" placeholder="Tulis nama kelas" >
        </div>
        <div class="field col-12 md:col-6">
            <label htmlfor="waliKelas">Wali Kelas<span class="p-error">*</span></label>
            <p-dropdown [options]="dropdownWaliKelas" [(ngModel)]="selectedWaliKelas" optionLabel="name" [filter]="true" filterBy="name" [showClear]="true" appendTo="body" placeholder="Pilih wali kelas">
                <ng-template pTemplate="selectedItem">
                    <div class="flex align-items-center gap-2" *ngIf="selectedWaliKelas">
                        <div>{{ selectedWaliKelas.name }}</div>
                    </div>
                </ng-template>
                <ng-template let-waliKelas pTemplate="item">
                    <div class="flex align-items-center gap-2">
                        <div>{{ waliKelas.name }}</div>
                    </div>
                </ng-template>
            </p-dropdown>
        </div>
        <div class="field col-12 md:col-6">
            <label htmlfor="kapasitasMurid">Kapasitas Murid<span class="p-error">*</span></label>
            <input pinputtext="" id="kapasitasMurid" type="text" class="p-inputtext customInputText" placeholder="Tulis kapasitas murid" >
        </div>
    </div>
    <!-- end :: Konten Dialog -->
    
    <!-- begin :: Footer Dialog -->
    <ng-template pTemplate="footer">
        <p-button 
            label="Kembali" 
            [outlined]="true" 
            severity="blockCustomGrayButton" 
            (onClick)="visible = false" 
            class="mr-2" />
        <p-button 
            label="Simpan" 
            [outlined]="true" 
            severity="blockCustomBlueButton" 
            (onClick)="visible = false" />
    </ng-template>
    <!-- end :: Footer Dialog -->
</p-dialog>
<!-- end :: Dialog Tambah Kelas -->
<!-- end :: Halaman Tambah Kelas -->
